<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>金融猎手</title>
  <script>
    // GitHub Pages SPA redirect
    // 当访问 /financial-hunter/register 等子路由时，
    // GitHub Pages 找不到对应文件会显示此 404.html
    // 我们需要将路径信息传递给 index.html 来处理路由
    var segment_count = 1; // 'financial-hunter' 占一段
    var l = window.location;
    var path = l.pathname.replace(/^\/financial-hunter\/?/, '');
    if (path) {
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/financial-hunter/' + '#/' + path +
        (l.search ? '?' + l.search.slice(1) : '') +
        l.hash
      );
    } else {
      l.replace('/financial-hunter/');
    }
  </script>
</head>
<body>
  <p>正在跳转...</p>
</body>
</html>
